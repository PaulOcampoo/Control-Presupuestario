name: Backup diario de Neon a Vercel Blob

# prompt-p6-backup-neon.md: backup lógico (pg_dump) de la base de datos de
# producción hacia Vercel Blob. Cadencia diaria y retención de 2 niveles
# (30 días + 12 meses) desde prompt-ajuste-backup-diario.md — antes corría
# semanal con retención plana de 8 (ver historial de este archivo); se
# ajustó porque con los módulos financieros activos (Control de Cuentas,
# Control Financiero) una ventana de pérdida de una semana completa ya no
# es aceptable. Ver la lógica de rotación en scripts/backup-neon-to-blob.js.
#
# Corre en GitHub Actions, no en Vercel Cron: pg_dump no está disponible en
# el runtime serverless de Vercel (Node.js administrado, sin binarios nativos
# del sistema — el mismo motivo por el que este proyecto ya necesitó
# @sparticuz/chromium para poder correr Chromium ahí; no existe un paquete
# equivalente ampliamente usado para pg_dump). vercel.json además ya limita
# maxDuration a 90s para la función que sirve la app. Los runners
# ubuntu-latest de GitHub Actions no tienen ese límite.
#
# 🔴 CRÍTICO — usar la conexión DIRECTA de Neon, NUNCA la pooled (la misma
# que usa la app en Vercel, host con "-pooler" en el nombre). Confirmado
# empíricamente contra Preview durante el desarrollo de este workflow:
# correr pg_dump contra el endpoint pooled dejó `search_path` roto (vacío)
# en OTRAS conexiones nuevas contra ese mismo pooler durante varios minutos
# (pg_dump emite `SET search_path=''` a nivel de sesión, y el pooler de Neon
# no siempre resetea limpio el backend físico reutilizado entre clientes) —
# cualquier query sin calificar esquema (`SELECT * FROM usuarios`, como usa
# TODA la app) habría fallado con "relation does not exist" para cualquier
# request real que compartiera ese backend mientras duró. Repetido con la
# conexión DIRECTA (sin "-pooler" en el host): el pooled quedó intacto antes,
# durante y después. Nunca pasar la DATABASE_URL de Vercel (pooled) aquí.
#
# Secrets de repo requeridos (Settings → Secrets and variables → Actions):
#   - NEON_PRODUCTION_DATABASE_URL_DIRECT: connection string DIRECTA (sin
#     "-pooler") de la rama PRODUCTION en Neon. Se obtiene en el dashboard de
#     Neon → Connection Details → desmarcar "Pooled connection". Distinta de
#     la DATABASE_URL que usa la app en Vercel (esa SÍ debe seguir pooled).
#   - BLOB_READ_WRITE_TOKEN: el mismo token que ya usa la app en Vercel
#     (Production) para subir/leer blobs — así los backups viven en el mismo
#     store que los PDFs de contrato, administrable desde el mismo dashboard.

on:
  schedule:
    # Todos los días 09:00 UTC (~03:00-04:00 hora de Ciudad de México, según
    # horario de verano) — hora baja de uso. Antes solo domingo (semanal).
    - cron: '0 9 * * *'
  workflow_dispatch: {} # permite correrlo manualmente desde la pestaña Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Neon corre Postgres 18. Confirmado con pg_dump real contra Preview:
      # el paquete "postgresql-client" del repo default de Ubuntu instala una
      # versión vieja (16.x) que pg_dump RECHAZA usar contra un servidor 18
      # ("aborting because of server version mismatch") — hay que instalar
      # postgresql-client-18 específicamente vía el repo oficial de PGDG.
      #
      # 🔴 Confirmado en la primera corrida real (2026-07-28, run 30392101676):
      # instalar postgresql-client-18 NO basta — el runner de ubuntu-latest ya
      # trae un pg_dump 16.x preinstalado más temprano en el PATH, y el
      # comando plano `pg_dump` seguía resolviendo a ese binario viejo pese a
      # tener el 18 instalado. Hay que invocar el binario por ruta explícita
      # (/usr/lib/postgresql/18/bin/pg_dump), no confiar en el PATH.
      - name: Instalar cliente de Postgres 18 (pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias (@vercel/blob, pg)
        run: npm install --omit=dev --no-audit --no-fund @vercel/blob pg

      - name: Generar dump comprimido
        env:
          DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DATABASE_URL_DIRECT }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "Falta el secret NEON_PRODUCTION_DATABASE_URL_DIRECT — no se puede continuar." >&2
            exit 1
          fi
          FECHA=$(date -u +%F)
          echo "FECHA=$FECHA" >> "$GITHUB_ENV"
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" --no-owner --no-privileges | gzip > "backup-$FECHA.sql.gz"
          ls -lh "backup-$FECHA.sql.gz"

      - name: Subir a Vercel Blob y rotar backups viejos (retener 30 diarios + 12 mensuales)
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/backup-neon-to-blob.js "backup-${{ env.FECHA }}.sql.gz"

      # prompt-fix-notificacion-backup-solo-main.md: NEON_PRODUCTION_DATABASE_URL_DIRECT
      # es un secret de repo, no restringido a main -- un workflow_dispatch manual
      # desde cualquier branch (ej. probando el workflow durante desarrollo) escribe
      # en la MISMA tabla de notificaciones de Producción que ve el equipo real.
      # Incidente real: prueba manual en feat/backup-diario (2026-09-02) insertó
      # notificaciones de "fallo de backup" para los 6 admin/desarrollador reales,
      # sin que hubiera fallado el backup real de producción. El fallo sigue
      # quedando visible en el log de Actions para cualquier run (no se toca eso)
      # -- solo se restringe a quién avisamos dentro de la app.
      - name: Avisar a admin/desarrollador si algo falló
        if: failure() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.NEON_PRODUCTION_DATABASE_URL_DIRECT }}
        run: node scripts/notificar-fallo-backup.js
