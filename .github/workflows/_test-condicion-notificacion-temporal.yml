name: TEST TEMPORAL - condicion notificacion backup

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Forzar fallo (simula backup roto)
        run: exit 1

      - name: Notificaria en produccion? (misma condicion que backup-neon.yml)
        if: failure() && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        run: echo "SE HABRIA NOTIFICADO -- esto seria un bug"

      - name: Confirmar que se suprimio
        if: failure() && !(github.event_name == 'schedule' && github.ref == 'refs/heads/main')
        run: echo "OK: notificacion correctamente suprimida (event=${{ github.event_name }}, ref=${{ github.ref }})"
